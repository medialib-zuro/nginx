server {
    listen       8090;
    listen       [::]:8090;
    server_name  localhost;

    # SSL configuration
    #
    listen 443 ssl;
    listen [::]:443 ssl;
    #
    # Note: You should disable gzip for SSL traffic.
    # See: https://bugs.debian.org/773332
    #
    # Read up on ssl_ciphers to ensure a secure configuration.
    # See: https://bugs.debian.org/765782
    #
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    # Self signed certs generated by the ssl-cert package
    # Don't use them in a production server!
    #
    ssl_certificate /home/leo/ca/leo.medialab.com.crt;
    ssl_certificate_key /home/leo/ca/leo.medialab.com.key;
    ssl_session_tickets off;
    # include snippets/snakeoil.conf;

    #keepalive_requests 1;

    access_log   logs/live.access.log main;
    error_log    logs/live.error.log notice;

    req_status live_host live_channel;

    location / {
	    root html;
        chunked_transfer_encoding off;
    }
    location /req_status {
        access_log off;
        req_status_show;
    }
    location ~^/playback/.*.m3u8 {
        req_status_on on;
        root html;
        try_files $uri =404;
    }
    location ~^/hls/.*.m3u8 {
        root html;
        try_files $uri =404;
        chunked_transfer_encoding off;
    }
    location /live {
        req_status_on off;
        #chunked_transfer_encoding off;
        #access_by_lua_file ../site/lualib/live/auth.lua;
        live zone_live;
        playback_hls path=html/playback segment=3s:6s segments=5 low_latency; # for playback
        # template support $name $time $seq
        live_hls path=html/hls m3u8=index.m3u8 template=l_$time_1_$seq.ts segment=3s:6s segments=5 max_gop=5 key_flag=0 key_url=/hls; # for live
        #live_hls path=html/hls m3u8=index.m3u8 template=l_$time_1_$seq.ts segment=6s:12s segments=5 max_gop=5 low_latency key_flag=0 key_url=/hls restore; # for live
        #live_hls path=html/hls m3u8=index.m3u8 template=l_$time_1_$seq.ts segment=9s:12s segments=5 max_gop=90 max_size=32000000 key_flag=0 key_url=/hls restore; # for live
        #live_hls path=html/hls m3u8=index.m3u8 prefix=http://10.10.4.188/redirect/hls/$name/ template=l_$time_1_$seq.ts segment=3s:5s segments=5 max_gop=10 key_flag=0 key_url=/hls restore; # for live
        # key_flag=[0/1] 0:clear, 1:aes-128; must set 'key_url' at same time;
        # live_hls path=html/hls segment=6s:12s segments=5 key_flag=1 key_url=/hls;
        live_methods GET POST;
        client_max_body_size 0;
        keepalive_timeout  10;
	    send_timeout 10;
    }
}

