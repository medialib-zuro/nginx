server {
    listen       80;
    listen       [::]:80;
    server_name leo.medialab.com;

    root /var/www/html;

    # Add index.php to the list if you are using PHP
    index index.html index.htm index.nginx-debian.html;

    access_log   logs/vod.access.log main;
    error_log    logs/vod.error.log notice;

    location / {
        allow all;
        chunked_transfer_encoding on;
        if ($request_method = OPTIONS ) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Headers Origin,X-Requested-With,Content-Type,Accept,Range;
            return 200;
        }
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Access-Control-Allow-Origin '*';
	    add_header Access-Control-Allow-Headers Origin,X-Requested-With,Content-Type,Accept,Range;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        # limit_rate 1000k;	
    }
    location /hls {
        root html;
        allow all;
    }
    location /shm {
        root /home/leo;
        allow all;
	    sendfile on;
        chunked_transfer_encoding on;
        # limit_rate 450k;	
    }
    location /stream-manager {
        #access_log off;
	    try_files $uri $uri/ =404;
    }
    location /redirect/ {
	    #rewrite ^/redirect/(.*)$ /$1 redirect;
	    rewrite ^/redirect/(.*)$ http://10.10.4.188:8090/$1 redirect;
    }
    location /permanent/ {
        #rewrite ^/permanent/(.*)$ /$1 permanent;
	    rewrite ^/permanent/(.*)$ http://10.10.4.188:8090/$1 permanent;
    }
}

