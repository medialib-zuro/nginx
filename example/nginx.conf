user  leo;
#daemon off;
#master_process off;
worker_processes  1;
worker_rlimit_nofile 65535;
worker_rlimit_core 10240m;

error_log  logs/error.log notice;

pid       logs/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    resolver      8.8.8.8 114.114.114.114 valid=30s ipv6=off;

    log_format  main  '$remote_addr - [$time_local] "$request" $http_user_agent '
                      '$status $http_range $body_bytes_sent $request_time';
    access_log  logs/access.log main;

    sendfile        on;
    tcp_nopush     on;

    keepalive_timeout  40s;
    client_body_timeout 40s;
    send_timeout 40s;

    #gzip  on;

    #live_zone zone=zone_live:10m persistent;
    live_zone zone=zone_live:10m;
    #live_buffers $num $size; size = (int) ($size/188 + 1) * 188;
    live_buffers 256 20480;
    live_gop_cache off;
    live_hls_enabled off;

    req_status_zone live_host $server_name 3m;
    req_status_zone live_channel $uri 3m;
    req_status_zone vod_host $server_name 3m;

    #req_status_interval 3; # sec
    req_status_restore off;
    req_status_dump_period 120; # sec
    #req_status_lock_time 10; # sec

    include conf.d/*.conf;
    include sites-enabled/*.conf;

}

